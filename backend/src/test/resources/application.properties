spring.application.name=backend-test

server.port=8080
server.ssl.enabled=false

spring.datasource.url=jdbc:h2:mem:bookfair_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.debug=false

app.jwtSecret=test-secret-key-1234567890-
app.jwtExpirationMs=3000000

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://example.com/
auth0.audience=https://stallreservation.com/api
